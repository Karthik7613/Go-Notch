services:
  - type: web
    name: whatsapp-message-monitor
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter # Starter plan recommended to keep WhatsApp connection alive 24/7
    region: oregon
    healthCheckPath: /health
    disk:
      name: whatsapp-persistent-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: AUTH_FOLDER
        value: /app/data/auth_info_baileys
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
